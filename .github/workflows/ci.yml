name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Swift packages
        run: swift build

      - name: Install pinned XcodeGen
        run: scripts/install_xcodegen.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build macOS app (unsigned)
        run: >
          xcodebuild -project Yank.xcodeproj -scheme Yank -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO build

      - name: Build iOS app (simulator, unsigned)
        run: >
          xcodebuild -project Yank.xcodeproj -scheme YankiOS -configuration Debug
          -destination 'platform=iOS Simulator,name=iPhone 17'
          CODE_SIGNING_ALLOWED=NO build
