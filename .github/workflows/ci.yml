name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Run package and public repository tests
        run: swift test

      - name: Install pinned XcodeGen
        run: scripts/install_xcodegen.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Test macOS app (unsigned)
        run: >
          xcodebuild -project Yank.xcodeproj -scheme Yank -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO test

      - name: Test iOS app (simulator, unsigned)
        run: >
          xcodebuild -project Yank.xcodeproj -scheme YankiOS -configuration Debug
          -destination 'platform=iOS Simulator,name=iPhone 17'
          CODE_SIGNING_ALLOWED=NO test
