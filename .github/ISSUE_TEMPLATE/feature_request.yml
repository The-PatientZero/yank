name: Feature request
description: Suggest an improvement to Yank.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options: [Mac, iPhone, iPad]
