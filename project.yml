# XcodeGen spec — the source of truth for Yank.xcodeproj.
# Regenerate after editing:  xcodegen generate

name: Yank

options:
  bundleIdPrefix: com.thepatientzero
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    APS_ENVIRONMENT: development
  configs:
    Release:
      APS_ENVIRONMENT: production

targets:
  Yank:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - AppDelegate.swift
      - YankApp.swift
      - Shared
      - Sources/YankCore
      - Sources/YankCloudKitSync
      - Services
      - Views
      - path: Assets.xcassets
    dependencies:
      - sdk: AppIntents.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thepatientzero.yank
        PRODUCT_NAME: Yank
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Yank.entitlements
        "CODE_SIGN_IDENTITY[sdk=macosx*]": Apple Development
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ARCHS: [arm64, x86_64]
        ONLY_ACTIVE_ARCH: NO
        COMBINE_HIDPI_IMAGES: YES
        AUTOMATION_APPLE_EVENTS: NO
        ENABLE_RESOURCE_ACCESS_AUDIO_INPUT: NO
        ENABLE_RESOURCE_ACCESS_CALENDARS: NO
        ENABLE_RESOURCE_ACCESS_CAMERA: NO
        ENABLE_RESOURCE_ACCESS_CONTACTS: NO
        ENABLE_RESOURCE_ACCESS_LOCATION: NO
        ENABLE_RESOURCE_ACCESS_PHOTO_LIBRARY: NO

  YankAppTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Tests/YankAppTests
    dependencies:
      - target: Yank
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thepatientzero.yank.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Yank:
    build:
      targets:
        Yank: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - YankAppTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
