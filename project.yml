# XcodeGen spec — the source of truth for Yank.xcodeproj.
# Regenerate after editing:  xcodegen generate
#
# Four targets share the platform-agnostic core in place (no module import, the
# same no-duplication pattern the project has always used):
#   Yank          macOS menu-bar app  (full core + Views + AppKit services)
#   YankiOS       iOS app             (full core + iOS UI + CloudKit sync)
#   YankKeyboard  iOS keyboard ext    (LEAN core — no CloudKit)
#   YankShare     iOS share ext       (LEAN core — no CloudKit)

name: Yank

options:
  bundleIdPrefix: com.thepatientzero
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.4"
    CURRENT_PROJECT_VERSION: "1"
    APS_ENVIRONMENT: development
    ICLOUD_CONTAINER_ENVIRONMENT: Development
  configs:
    Release:
      APS_ENVIRONMENT: production
      ICLOUD_CONTAINER_ENVIRONMENT: Production

targets:

  # ---- macOS menu-bar app ---------------------------------------------------
  Yank:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - AppDelegate.swift
      - YankApp.swift
      - Shared
      - Sources/YankCore
      - Sources/YankCloudKitSync
      - Services
      - Views
      - path: Privacy/Yank/PrivacyInfo.xcprivacy
      - path: Assets.xcassets
    # Xcode 17 runs App Intents metadata extraction on application targets even
    # when they do not declare shortcuts. An explicit system-framework link keeps
    # that processor warning-free; only the iOS app currently defines an intent.
    dependencies:
      - sdk: AppIntents.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thepatientzero.yank
        PRODUCT_NAME: Yank
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Yank.entitlements
        "CODE_SIGN_IDENTITY[sdk=macosx*]": Apple Development
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ARCHS: [arm64, x86_64]
        ONLY_ACTIVE_ARCH: NO
        COMBINE_HIDPI_IMAGES: YES
        AUTOMATION_APPLE_EVENTS: NO
        ENABLE_RESOURCE_ACCESS_AUDIO_INPUT: NO
        ENABLE_RESOURCE_ACCESS_CALENDARS: NO
        ENABLE_RESOURCE_ACCESS_CAMERA: NO
        ENABLE_RESOURCE_ACCESS_CONTACTS: NO
        ENABLE_RESOURCE_ACCESS_LOCATION: NO
        ENABLE_RESOURCE_ACCESS_PHOTO_LIBRARY: NO

  # ---- iOS app: full core + CloudKit sync + Spotlight + App Intent ----------
  YankiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Shared/DesignScale.swift
      - Shared/ClipKind.swift
      - Shared/OCRService.swift
      - Shared/TagChip.swift
      - Shared/Theme.swift
      - Shared/ClipLayout.swift
      - Shared/SettingsDefaults.swift
      - Shared/YankInk.swift
      - Shared/ClipStatusBadge.swift
      - Shared/ThumbnailCache.swift
      - Shared/ClipPresentationCache.swift
      - Shared/SyncCopy.swift
      - Shared/YankWordmark.swift
      - Shared/ClipSwatchPreview.swift
      - Shared/ClipKindIcon.swift
      - Shared/UndoDeleteBanner.swift
      - Shared/StorageUnavailableBanner.swift
      - Shared/AppNotifications.swift
      - Sources/YankCore
      - Sources/YankCloudKitSync
      - iOS/AppGroupContainer.swift
      - iOS/AppGroupContext.swift
      - iOS/ClipStore.swift
      - iOS/ClipStore+Mutations.swift
      - iOS/IOSSettings.swift
      - iOS/IOSSyncedSettingsBridge.swift
      - iOS/HistoryLimitConfirmation.swift
      - iOS/YankIOSDesignSystem.swift
      - iOS/YankApp.swift
      - iOS/HistoryView.swift
      - iOS/HistoryEmptyStates.swift
      - iOS/HistorySupportViews.swift
      - iOS/SettingsView.swift
      - iOS/ClipRowView.swift
      - iOS/ClipTileView.swift
      - iOS/ClipThumbnailView.swift
      - iOS/ClipDetailView.swift
      - iOS/ClipPeekView.swift
      - iOS/EmptyStateView.swift
      - iOS/ShareSheet.swift
      - iOS/CaptureClipIntent.swift
      - Shared/SpotlightIndexer.swift
      - iOS/YankAppDelegate.swift
      - path: Privacy/YankiOS/PrivacyInfo.xcprivacy
      - path: iOS/Assets.xcassets
    dependencies:
      - sdk: AppIntents.framework
      - target: YankKeyboard
        embed: true
      - target: YankShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thepatientzero.yank
        PRODUCT_NAME: YankiOS
        INFOPLIST_FILE: iOS/App-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: iOS/Yank-iOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"

  # ---- iOS keyboard extension (lean core, no CloudKit) ----------------------
  # The design tokens, ClipKind, and the iOS brand bridges are pulled in (in place,
  # no module import — the project's no-duplication pattern) so the keyboard's rows
  # and empty hint render in real Yank brand instead of system chrome.
  YankKeyboard:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/YankCore/ClipboardItem.swift
      - Sources/YankCore/ClipboardSearchIndex.swift
      - Sources/YankCore/ContentClassifier.swift
      - Sources/YankCore/KeyboardClipSearch.swift
      - Sources/YankCore/KeyboardHistoryProjection.swift
      - Sources/YankCore/KeyboardHistoryReader.swift
      - Sources/YankCore/ShareCaptureInbox.swift
      - Sources/YankCore/SyncBlobPolicy.swift
      - Shared/DesignScale.swift
      - Shared/YankInk.swift
      - Shared/ClipKind.swift
      - Shared/ClipPresentationCache.swift
      - Shared/YankWordmark.swift
      - iOS/YankIOSDesignSystem.swift
      - iOS/AppGroupContainer.swift
      - iOS/KeyboardStatusView.swift
      - iOS/KeyboardViewController.swift
      - path: Privacy/Extensions/PrivacyInfo.xcprivacy
    dependencies:
      - sdk: AppIntents.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thepatientzero.yank.keyboard
        PRODUCT_NAME: YankKeyboard
        INFOPLIST_FILE: iOS/Keyboard-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: iOS/Yank-iOS-Extension.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"

  # ---- iOS share extension (lean core, no CloudKit) -------------------------
  # Same shared-token pull-in as the keyboard, so the post-save confirmation card
  # reads as Yank (brand checkmark + wordmark + kind-aware excerpt).
  YankShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/YankCore/ClipboardItem.swift
      - Sources/YankCore/ClipboardSearchIndex.swift
      - Sources/YankCore/ContentClassifier.swift
      - Sources/YankCore/KeyboardHistoryProjection.swift
      - Sources/YankCore/ShareCaptureInbox.swift
      - Sources/YankCore/ShareImageImportPolicy.swift
      - Sources/YankCore/SyncBlobPolicy.swift
      - Shared/DesignScale.swift
      - Shared/YankInk.swift
      - Shared/ClipKind.swift
      - Shared/ClipPresentationCache.swift
      - Shared/YankWordmark.swift
      - iOS/YankIOSDesignSystem.swift
      - iOS/AppGroupContainer.swift
      - iOS/ShareConfirmationView.swift
      - iOS/ShareViewController.swift
      - path: Privacy/Extensions/PrivacyInfo.xcprivacy
    dependencies:
      - sdk: AppIntents.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thepatientzero.yank.share
        PRODUCT_NAME: YankShare
        INFOPLIST_FILE: iOS/Share-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: iOS/Yank-iOS-Extension.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"

  YankAppTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Tests/YankAppTests
    dependencies:
      - target: Yank
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thepatientzero.yank.tests
        GENERATE_INFOPLIST_FILE: YES

  YankiOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Tests/YankiOSTests
    dependencies:
      - target: YankiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thepatientzero.yank.ios.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Yank:
    build:
      targets:
        Yank: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - YankAppTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  YankiOS:
    build:
      targets:
        YankiOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - YankiOSTests
    archive:
      config: Release
